name: anketa
services:
  anketa_fe:
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:-latest}
    command: python anketa.py
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
        
    env_file:
      - ${ANKETA_ENV_FILE:-/opt/anketa/shared/app.env}
    volumes:
      - type: bind
        source: /opt/anketa/data
        target: /home/anketa/data
      - type: bind
        source: /opt/anketa/logs
        target: /home/anketa/logs
      - type: bind
        source: /opt/anketa/session
        target: /home/anketa/session
      - type: bind
        source: /opt/anketa/images
        target: /home/anketa/images
      - type: bind
        source: /opt/anketa/questionfiles
        target: /home/anketa/questionfiles
      - type: bind
        source: /opt/anketa/reports
        target: /home/anketa/reports
